name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    env:
      Jwt__Key: ci-only-signing-key-0123456789-abcdefghijkl
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore RaceDayApi.Tests

    - name: Build
      run: dotnet build RaceDayApi.Tests --no-restore --configuration Release

    - name: Test
      run: dotnet test RaceDayApi.Tests --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - run: npm ci

    - name: Install the browser
      run: npx playwright install --with-deps chromium

    # Playwright starts the API (fresh SQLite database) and the Vite dev server itself
    - name: Run the end-to-end tests
      run: npm run e2e

    - name: Upload the report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
    - uses: actions/checkout@v4

    - name: Build the image
      run: docker build -t raceday:ci .

    - name: Smoke test the container
      run: |
        docker run -d --name raceday -p 8080:8080 \
          -e Jwt__Key=ci-only-signing-key-0123456789-abcdefghijkl \
          -e Seed__AdminEmail=admin@raceday.local \
          -e Seed__AdminPassword='Ci#Admin12345' \
          raceday:ci
        for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
        curl -fs http://localhost:8080/health
        # the SPA shell and a client-side route
        curl -fs http://localhost:8080/ | grep -q '<div id="root">'
        curl -fs http://localhost:8080/events/1 | grep -q '<div id="root">'
        # the API, and unknown API routes are real 404s
        curl -fs http://localhost:8080/api/events | grep -q '"items"'
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)" = "404"
        # the seeded admin can sign in
        curl -fs -X POST -H 'Content-Type: application/json' \
          -d '{"email":"admin@raceday.local","password":"Ci#Admin12345"}' \
          http://localhost:8080/api/auth/login | grep -q '"token"'

    - name: Container logs
      if: failure()
      run: docker logs raceday
